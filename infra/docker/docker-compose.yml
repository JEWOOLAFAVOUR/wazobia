services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wazobia
      POSTGRES_PASSWORD: wazobia
      POSTGRES_DB: wazobia
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wazobia"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6381:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  server:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.server
    environment:
      PORT: 8080
      DATABASE_URL: postgres://wazobia:wazobia@postgres:5432/wazobia?sslmode=disable
      REDIS_ADDR: redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8081
      NEXT_PUBLIC_WS_URL: ws://localhost:8081/ws
    ports:
      - "3001:3000"
    depends_on:
      - server

volumes:
  pgdata:
  redisdata:
